name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-
      - run: bun install
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-
      - run: bun install
      - run: bun run test
      - name: Enforce coverage floors
        run: bun run coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-
      - run: bun install
      - run: bun run build

  typecheck-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Boundaries of the host peerDependency range (react-native >=0.72.0):
        # the supported floor and the current latest.
        react-native: ["0.72.0", "0.86.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-rn${{ matrix.react-native }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-rn${{ matrix.react-native }}-
      - run: bun install
      - name: Install React Native ${{ matrix.react-native }}
        run: bun add --dev react-native@${{ matrix.react-native }} --cwd packages/host
      - name: Typecheck host with RN ${{ matrix.react-native }}
        run: bun run --filter '@couch-kit/host' typecheck

  # Require a changeset on human PRs that touch published packages. Skipped for
  # the automated Changesets "Version Packages" PR and for Renovate dependency
  # PRs (a job skipped via `if:` counts as passing for branch protection). If a
  # Renovate runtime-dependency bump should ship to consumers, add a changeset
  # to that PR by hand.
  changesets:
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main' && !startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-
      - run: bun install
      - run: bunx changeset status --since=origin/main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
