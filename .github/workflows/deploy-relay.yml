name: Deploy Relay

# Redeploys the game-agnostic relay (services/relay) to Azure Container Apps.
# Auth is via GitHub OIDC federated credentials — no stored Azure passwords,
# same philosophy as the npm Trusted Publishing used by release.yml.

on:
  push:
    branches: [main]
    paths:
      - "services/relay/**"
      - ".github/workflows/deploy-relay.yml"
  workflow_dispatch:

permissions:
  id-token: write # required to request the OIDC token for azure/login
  contents: read

concurrency:
  group: deploy-relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        uses: azure/cli@v3
        with:
          azcliversion: latest
          inlineScript: |
            az config set extension.use_dynamic_install=yes_without_prompt
            az containerapp up \
              --name couch-kit-relay \
              --resource-group couch-kit-rg \
              --location eastus \
              --source services/relay \
              --ingress external \
              --target-port 8787
            # Rooms are in-memory, so the relay must never run more than one
            # replica — a second replica would own a disjoint set of rooms and
            # silently split games in half.
            #
            # min-replicas stays at 1. Scaling to zero was tried and reverted:
            # the measured cold start is ~23s (warm connect is 247ms), which is
            # someone watching a blank TV while the container pulls and boots.
            # The saving was ~$10-34/mo of credits — not worth it.
            az containerapp update \
              --name couch-kit-relay \
              --resource-group couch-kit-rg \
              --min-replicas 1 \
              --max-replicas 1
