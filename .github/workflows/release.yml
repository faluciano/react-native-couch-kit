name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # Trusted publishing (OIDC) requires a recent npm CLI (>= 11.5.1). The
      # runner's bundled npm may be older, so upgrade it before publishing.
      # Pinned to a major, not `latest`: a new npm major landing mid-release
      # would otherwise change how every package is published, unreviewed.
      # The global npm prefix is root-owned on GitHub runners, so use sudo.
      - name: Ensure npm supports trusted publishing (OIDC)
        run: |
          sudo npm install -g npm@^11.5.1
          npm --version

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # `app-id` is deprecated in favor of `client-id`. The action passes
          # either straight through as the JWT issuer, which GitHub accepts as
          # the App ID or the client ID, so the existing secret still works.
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          # changesets/action 2.1 renamed `version` and `publish` to the
          # `-script` forms; the old names hard-fail the step.
          version-script: bun run version
          publish-script: bun run release
          # 2.1 refuses a GITHUB_TOKEN env var that differs from this input,
          # so the App token has to go here rather than in `env`.
          github-token: ${{ steps.app-token.outputs.token }}
          # The action tags each published package and creates its GitHub
          # release from the CHANGELOG section itself (createGithubReleases
          # defaults to true). A hand-rolled release step used to run after
          # this one and fail on every package with "tag_name already
          # exists", which went unnoticed while its failures were swallowed.

      - name: Enable auto-merge
        if: steps.changesets.outputs.pr-number
        run: gh pr merge ${{ steps.changesets.outputs.pr-number }} --auto --squash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
